        <ol class="track-list" id="pl-list">
          <li data-id="3393802973" data-dur="274"><button class="track-btn" type="button"><span class="track-no">1</span><span class="track-name">把生活种成光</span><span class="track-dur">4:34</span></button></li>
          <li data-id="3394704415" data-dur="308"><button class="track-btn" type="button"><span class="track-no">2</span><span class="track-name">野风向北</span><span class="track-dur">5:08</span></button></li>
          <li data-id="3394938326" data-dur="184"><button class="track-btn" type="button"><span class="track-no">3</span><span class="track-name">乱得漂亮</span><span class="track-dur">3:04</span></button></li>
          <li data-id="3394945050" data-dur="354"><button class="track-btn" type="button"><span class="track-no">4</span><span class="track-name">先做自己的太阳</span><span class="track-dur">5:54</span></button></li>

    <script>
      (function () {
        const audio = document.getElementById("pl-audio");
        const rows = Array.from(document.getElementById("pl-list").children);
        const toggle = document.getElementById("pl-toggle");
        const seek = document.getElementById("pl-seek");
        const titleEl = document.getElementById("pl-title");
        const stateEl = document.getElementById("pl-state");
        const curEl = document.getElementById("pl-cur");
        const durEl = document.getElementById("pl-dur");
        const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        const PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
        let idx = -1, dragging = false;

        const fmt = (s) => {
          s = Math.max(0, Math.floor(s || 0));
          return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
        };
        const name = (i) => rows[i].querySelector(".track-name").textContent;
        const total = () => (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : Number(rows[Math.max(idx, 0)].dataset.dur);

        function paint() {
          const t = total(), c = audio.currentTime || 0;
          seek.max = t;
          if (!dragging) seek.value = c;
          curEl.textContent = fmt(dragging ? seek.value : c);
          durEl.textContent = fmt(t);
        }

        function ui() {
          const playing = idx >= 0 && !audio.paused;
          toggle.innerHTML = playing ? PAUSE : PLAY;
          rows.forEach((r, i) => r.classList.toggle("is-current", i === idx));
          if (idx >= 0) {
            titleEl.textContent = name(idx);
            stateEl.textContent = (playing ? "正在播放" : "已暂停") + " · 第 " + (idx + 1) + " 首";
          }
        }

        function select(i) {
          if (i === idx) {
            audio.paused ? audio.play().catch(() => {}) : audio.pause();
            ui();
            return;
          }
          idx = i;
          audio.src = "https://music.163.com/song/media/outer/url?id=" + rows[i].dataset.id + ".mp3";
          audio.load();
          audio.play().catch(() => {
            stateEl.textContent = "若无法直接播放，请前往网易云音乐收听";
          });
          ui();
          paint();
        }

        toggle.addEventListener("click", () => select(idx < 0 ? 0 : idx));
        rows.forEach((r, i) => r.querySelector("button").addEventListener("click", () => select(i)));
        audio.addEventListener("timeupdate", paint);
        audio.addEventListener("play", ui);
        audio.addEventListener("pause", ui);
        audio.addEventListener("ended", () => select((idx + 1) % rows.length));
        audio.addEventListener("error", () => {
          stateEl.textContent = "当前曲目暂不可外链播放，可在网易云音乐搜索「霓凰」收听";
        });
        seek.addEventListener("input", () => { dragging = true; paint(); });
        seek.addEventListener("change", () => { dragging = false; audio.currentTime = Number(seek.value); paint(); });
      })();
    </script>
  </body>
</html>
