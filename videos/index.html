        },
        // AI 科普系列 (EP01 - EP26)
        { title: "EP01 · 什么是大语言模型（LLM）", cat: "AI 科普系列", date: "2026-10", desc: "两分钟看懂大语言模型是怎么学会说话的。", cover: "covers/ep01.jpg", src: "media/ep01-llm-v2.mp4" },
        { title: "EP02 · 什么是 Token（词元）", cat: "AI 科普系列", date: "2026-10", desc: "AI 眼里的文字不是字，而是一个个切分好的 Token。", cover: "covers/ep02.jpg", src: "media/ep02-token-v2.mp4" },
        { title: "EP03 · 什么是 Prompt（提示词）", cat: "AI 科普系列", date: "2026-10", desc: "为什么同样问 AI，有人问出神回复，有人只拿到废话？", cover: "covers/ep03.jpg", src: "media/ep03-prompt-v2.mp4" },

        { title: "EP05 · 什么是上下文窗口（Context Window）", cat: "AI 科普系列", date: "2026-10", desc: "聊着聊着 AI 就忘了前面说啥？因为它也有「桌面大小」。", cover: "covers/ep05.jpg", src: "media/ep05-context-v2.mp4" },
        { title: "EP06 · 什么是模型训练（Training）", cat: "AI 科普系列", date: "2026-10", desc: "从海量阅读到考试纠错，大模型是怎么「读完万卷书」的。", cover: "covers/ep06.jpg", src: "media/ep06-training-v2.mp4" },
        { title: "EP07 · 什么是多模态（Multimodal）", cat: "AI 科普系列", date: "2026-10", desc: "既能看图、听声，又能看视频和写代码。", cover: "covers/ep07.jpg", src: "media/ep07-multimodal-v2.mp4" },
        { title: "EP08 · 什么是 RAG（检索增强生成）", cat: "AI 科普系列", date: "2026-10", desc: "让 AI 答题前先翻一遍你给的资料，少胡编、更靠谱。", cover: "covers/ep08.jpg", src: "media/ep08-rag-v2.mp4" },
        { title: "EP09 · 什么是智能体（Agent）", cat: "AI 科普系列", date: "2026-10", desc: "从只会聊天的助手，变成能自己规划、调用工具干活的 Agent。", cover: "covers/ep09.jpg", src: "media/ep09-agent-v2.mp4" },
        { title: "EP10 · 什么是开源模型（Open Source）", cat: "AI 科普系列", date: "2026-10", desc: "闭源和开源模型差在哪？普通人也能在本地跑模型吗？", cover: "covers/ep10.jpg", src: "media/ep10-opensource-v2.mp4" },
        { title: "EP11 · 什么是 AIGC", cat: "AI 科普系列", date: "2026-10", desc: "生成式人工智能如何改变写文章、画画、做歌和拍视频。", cover: "covers/ep11.jpg", src: "media/ep11-aigc-v2.mp4" },
        { title: "EP12 · 什么是 AGI（通用人工智能）", cat: "AI 科普系列", date: "2026-10", desc: "比今天的大模型更进一步，AGI 到底意味着什么？", cover: "covers/ep12.jpg", src: "media/ep12-agi-v2.mp4" },
        { title: "EP13 · 什么是模型参数（Parameter）", cat: "AI 科普系列", date: "2026-10", desc: "常听到的 7B、70B 参数，究竟代表模型的什么能力？", cover: "covers/ep13.jpg", src: "media/ep13-parameter-v2.mp4" },
        { title: "EP14 · 什么是算力（Compute）", cat: "AI 科普系列", date: "2026-10", desc: "为什么训练和运行 AI 离不开显卡与庞大的算力集群？", cover: "covers/ep14.jpg", src: "media/ep14-compute-v2.mp4" },
        { title: "EP15 · 什么是微调（Fine-tuning）", cat: "AI 科普系列", date: "2026-10", desc: "给通用大模型做专业「岗前培训」，让它更懂特定行业。", cover: "covers/ep15.jpg", src: "media/ep15-finetune-v2.mp4" },
        { title: "EP16 · 什么是思维链（Chain of Thought）", cat: "AI 科普系列", date: "2026-10", desc: "让 AI「一步一步想」，为什么准确率会一下子提高？", cover: "covers/ep16.jpg", src: "media/ep16-cot-v2.mp4" },
        { title: "EP17 · 什么是扩散模型（Diffusion）", cat: "AI 科普系列", date: "2026-10", desc: "AI 画画和生成视频背后的魔法：从一片噪点里「擦」出画面。", cover: "covers/ep17.jpg", src: "media/ep17-diffusion-v2.mp4" },
        { title: "EP18 · 什么是具身智能（Embodied AI）", cat: "AI 科普系列", date: "2026-10", desc: "当 AI 装进机器人身体，开始看世界、拿东西、走进现实生活。", cover: "covers/ep18.jpg", src: "media/ep18-embodied-v2.mp4" },
        { title: "EP19 · 什么是模型对齐（Alignment）", cat: "AI 科普系列", date: "2026-10", desc: "怎么让聪明无比的 AI 懂规矩、守底线、站在人类这边？", cover: "covers/ep19.jpg", src: "media/ep19-alignment-v2.mp4" },
        { title: "EP20 · 什么是深度伪造（Deepfake）", cat: "AI 科普系列", date: "2026-10", desc: "换脸、拟声越来越逼真，我们该如何识别与防范？", cover: "covers/ep20.jpg", src: "media/ep20-deepfake-v2.mp4" },
        { title: "EP21 · 什么是世界模型（World Model）", cat: "AI 科普系列", date: "2026-10", desc: "不仅会接龙文字，还要在脑海里推演真实世界的物理规律。", cover: "covers/ep21.jpg", src: "media/ep21-world-model-v2.mp4" },
        { title: "EP22 · 什么是主动式智能体（Proactive Agent）", cat: "AI 科普系列", date: "2026-10", desc: "不用你每次催，AI 自己知道什么时候该提醒你、帮你做。", cover: "covers/ep22.jpg", src: "media/ep22-proactive-agent-v2.mp4" },
        { title: "EP23 · 什么是模型蒸馏（Distillation）", cat: "AI 科普系列", date: "2026-10", desc: "让大老师傅带小徒弟，把巨型模型的能力浓缩进轻量小模型。", cover: "covers/ep23.jpg", src: "media/ep23-distillation-v2.mp4" },
        { title: "EP24 · 什么是推理模型（Reasoning Model）", cat: "AI 科普系列", date: "2026-10", desc: "先停下来想清楚再回答：推理模型和普通聊天模型有什么区别？", cover: "covers/ep24.jpg", src: "media/ep24-reasoning-model-v2.mp4" },
        { title: "EP25 · 什么是 Computer Use（电脑操控）", cat: "AI 科普系列", date: "2026-10", desc: "AI 开始像人一样看屏幕、动鼠标、敲键盘操作软件。", cover: "covers/ep25.jpg", src: "media/ep25-computer-use-v2.mp4" },
        { title: "EP26 · 什么是 AI 内容检测（AI Detection）", cat: "AI 科普系列", date: "2026-11", desc: "文章、图片、视频真假难辨，检测技术是怎么找线索的？", cover: "covers/ep26.jpg", src: "media/ep26-ai-detection-v2.mp4" }
      ];

      const CATS = ["全部", "生活与观察", "音乐影像", "AI 科普系列"];
      const filtersEl = document.getElementById("filters");
      const gridEl = document.getElementById("video-grid");
      const modal = document.getElementById("modal");
      const modalTitle = document.getElementById("modal-title");
      const modalPlayer = document.getElementById("modal-player");
      const modalDesc = document.getElementById("modal-desc");
      const modalClose = document.getElementById("modal-close");

      let current = "全部";

      function renderFilters() {
        filtersEl.innerHTML = CATS.map(cat => {
          const count = cat === "全部" ? VIDEOS.length : VIDEOS.filter(v => v.cat === cat).length;
          const active = cat === current ? "is-active" : "";
          return `<button class="filter-btn ${active}" type="button" data-cat="${cat}">${cat} (${count})</button>`;
        }).join("");
      }

      function renderGrid() {
        const list = current === "全部" ? VIDEOS : VIDEOS.filter(v => v.cat === current);
        gridEl.innerHTML = list.map((v, i) => `
          <button class="media-card media-card--video" type="button" data-idx="${VIDEOS.indexOf(v)}">
            <div class="media-card__thumb">
              <img src="${v.cover}" alt="${v.title}" loading="lazy" />
              <div class="media-card__play" aria-hidden="true">
                <span class="media-card__play-icon">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </span>
              </div>
            </div>
            <div class="media-card__body">
              <span class="media-card__meta">${v.date} · ${v.cat}</span>
              <h2 class="media-card__title">${v.title}</h2>
              <p class="media-card__desc">${v.desc}</p>
            </div>
          </button>
        `).join("");
      }

      function openVideo(idx) {
        const v = VIDEOS[idx];
        if (!v) return;
        modalTitle.textContent = v.title;
        modalDesc.textContent = v.desc;
        modalPlayer.poster = v.cover;
        modalPlayer.src = v.src;
        modal.hidden = false;
        modalPlayer.play().catch(() => {});
      }

      function closeVideo() {
        modalPlayer.pause();
        modalPlayer.removeAttribute("src");
        modalPlayer.load();
        modal.hidden = true;
      }

      filtersEl.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-cat]");
        if (!btn) return;
        current = btn.dataset.cat;
        renderFilters();
        renderGrid();
      });

      gridEl.addEventListener("click", (e) => {
        const card = e.target.closest("button[data-idx]");
        if (!card) return;
        openVideo(Number(card.dataset.idx));
      });

      modalClose.addEventListener("click", closeVideo);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeVideo(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) closeVideo(); });

      renderFilters();
      renderGrid();
    </script>
  </body>
</html>
