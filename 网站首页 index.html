<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>joy 的个人主页</title>
<meta name="description" content="joy 的个人网站">
<style>
  :root {
    --bg: #fafbfc;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #4a6fa5;
    --accent-soft: #e8eef7;
    --border: #e5e7eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }
  header {
    padding: 96px 0 48px;
    text-align: center;
  }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8fa8c8, #d7e0ee);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    margin: 0 auto 24px;
  }
  header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: 0.02em; }
  header p.tagline { color: var(--muted); margin-top: 12px; font-size: 1.05rem; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
  }
  section h2 {
    font-size: 1.15rem;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent-soft);
  }
  section h2::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 10px;
    vertical-align: middle;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .tag {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .contact-list { list-style: none; }
  .contact-list li { padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .contact-list li:last-child { border-bottom: none; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 40px 0 64px;
  }
  @media (max-width: 560px) {
    header { padding: 64px 0 32px; }
    header h1 { font-size: 1.7rem; }
    section { padding: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="avatar">🐱</div>
    <h1>你好，我是 joy</h1>
    <p class="tagline">欢迎来到我的个人小站</p>
  </header>

  <section>
    <h2>关于我</h2>
    <p>你好呀，我是 joy。这里是我的个人网站，我会在这里记录生活、分享想法，慢慢把它填满。</p>
  </section>

  <section>
    <h2>我的日常</h2>
    <div class="tags">
      <span class="tag">铲屎官</span>
      <span class="tag">蓝白英短猫奴</span>
      <span class="tag">数码爱好者</span>
    </div>
    <p style="margin-top:16px; color: var(--muted); font-size: 0.95rem;">家里有一只肥嘟嘟的蓝白英短，是本站的首席监工。</p>
  </section>

  <section>
    <h2>联系我</h2>
    <ul class="contact-list">
      <li>GitHub：<a href="https://github.com/joyzhang0923" target="_blank" rel="noopener">github.com/joyzhang0923</a></li>
    </ul>
  </section>

  <footer>
    <p>© 2026 joy · 用心搭建</p>
  </footer>

</div>
</body>
</html>
